[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # 日本語プロンプト文字列が長くなるため行長チェックは対象外

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not llm_eval'"
markers = [
    "llm_eval: 実際にClaude APIを呼び出す判定精度のeval。コストがかかるため通常のpytest実行では除外される（`pytest -m llm_eval`で明示的に実行）。",
]
