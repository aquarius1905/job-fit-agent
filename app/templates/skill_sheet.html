{% extends "base.html" %}
{% block title %}プロフィール | job-fit-agent{% endblock %}
{% block content %}

<div id="saved-toast" class="notice notice-success toast" hidden>保存しました</div>

<section class="card">
  <h1>スキルシート登録</h1>
  <p class="muted">対象ファイル: Excel(.xlsx) / Word(.docx)。内容はこのマシンの data/ フォルダにのみ保存されます。</p>

  <div id="skill-sheet-error">
  {% if error %}
  <div class="notice notice-error">{{ error }}</div>
  {% endif %}
  </div>

  <form id="skill-sheet-form" method="post" action="/skill-sheet" enctype="multipart/form-data">
    <label class="field">
      <span>ファイルから登録</span>
      <input type="file" name="file" accept=".xlsx,.docx,.txt,.md">
    </label>

    <label class="field">
      <span>または直接編集・貼り付け</span>
      <textarea id="manual-text" name="manual_text" rows="16" placeholder="経歴・スキルをテキストで入力">{{ skill_sheet_text or '' }}</textarea>
    </label>

    <button type="submit">保存する</button>
  </form>
</section>

<section class="card">
  <h1>働き方の希望条件</h1>
  <p class="muted">案件判定時に、技術スキルだけでなく働き方の希望条件との合致度も評価に加味されます。</p>

  <form id="work-style-form" method="post" action="/work-style">
    <label class="field">
      <span>出社に関する希望（許容できる働き方をすべて選択）</span>
      <div class="checkbox-group">
        {% for opt in remote_options %}
        <label class="checkbox-item">
          <input type="checkbox" name="remote_options" value="{{ opt }}" {% if work_style and opt in (work_style.remote_options or []) %}checked{% endif %}>
          {{ opt }}
        </label>
        {% endfor %}
      </div>
    </label>

    <label class="field">
      <span>希望稼働日数（週あたり、許容できる日数をすべて選択）</span>
      <div class="checkbox-group">
        {% for opt in weekly_days_options %}
        <label class="checkbox-item">
          <input type="checkbox" name="weekly_days" value="{{ opt }}" {% if work_style and opt in (work_style.weekly_days or []) %}checked{% endif %}>
          {{ opt }}
        </label>
        {% endfor %}
      </div>
    </label>

    <label class="field">
      <span>希望単価（時給）</span>
      <div class="rate-range">
        <select name="rate_min">
          <option value="">下限指定なし</option>
          {% for r in rate_options %}
          <option value="{{ r }}" {% if work_style and work_style.rate_min == r|string %}selected{% endif %}>{{ r }}円</option>
          {% endfor %}
        </select>
        <span class="rate-sep">〜</span>
        <select name="rate_max">
          <option value="">上限指定なし</option>
          {% for r in rate_options %}
          <option value="{{ r }}" {% if work_style and work_style.rate_max == r|string %}selected{% endif %}>{{ r }}円</option>
          {% endfor %}
        </select>
      </div>
    </label>

    <label class="field">
      <span>ポジション</span>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" name="leader_ok" {% if work_style and work_style.leader_ok %}checked{% endif %}>
          リーダーポジション OK
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="pm_ok" {% if work_style and work_style.pm_ok %}checked{% endif %}>
          PMポジション OK
        </label>
      </div>
    </label>

    <label class="field">
      <span>その他の希望条件（自由記述）</span>
      <textarea name="free_text" rows="8" placeholder="貸与PC: どちらでも可能&#10;実装中心: ◯&#10;会議多め: ×&#10;新しい技術に触れられる: ◯">{{ (work_style.free_text if work_style else '') or '' }}</textarea>
    </label>

    <button type="submit">保存する</button>
  </form>
</section>

<script>
let savedToastTimer;
function showSavedToast() {
  const toast = document.getElementById('saved-toast');
  toast.hidden = false;
  clearTimeout(savedToastTimer);
  savedToastTimer = setTimeout(function () {
    toast.hidden = true;
  }, 5000);
}

{% if saved %}
showSavedToast();
history.replaceState(null, '', location.pathname);
{% endif %}

document.getElementById('skill-sheet-form').addEventListener('submit', function (e) {
  e.preventDefault();
  const form = e.target;
  const errorBox = document.getElementById('skill-sheet-error');
  fetch(form.action, {
    method: 'POST',
    headers: { 'X-Requested-With': 'fetch' },
    body: new FormData(form),
  })
    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
    .then(function (result) {
      if (result.ok) {
        errorBox.innerHTML = '';
        document.getElementById('manual-text').value = result.data.skill_sheet_text;
        showSavedToast();
      } else {
        errorBox.innerHTML = '<div class="notice notice-error"></div>';
        errorBox.firstChild.textContent = result.data.error;
      }
    });
});

document.getElementById('work-style-form').addEventListener('submit', function (e) {
  e.preventDefault();
  const form = e.target;
  fetch(form.action, {
    method: 'POST',
    headers: { 'X-Requested-With': 'fetch' },
    body: new FormData(form),
  })
    .then(function (res) {
      if (res.ok) showSavedToast();
    });
});
</script>

{% endblock %}
